[font]
# Font size in points
size = 14.0

[env]
TERM = "xterm-256color"

[font.normal]
family = "Noto Sans Mono"
style = "Regular"

[font.bold]
family = "Noto Sans Mono"
style = "Bold"

[font.italic]
family = "Noto Sans Mono"
style = "Italic"

[window]
decorations = "None"

[scrolling]
history = 10000

[cursor.style]
shape = "Block"
blinking = "Off"

# Colors matching Ghostty's default dark style
# (essentially the Tomorrow Night Bright palette on a #282c34 background)
[colors.primary]
background = "#282c34"
foreground = "#ffffff"

[colors.normal]
black   = "#1d1f21"
red     = "#cc6666"
green   = "#b5bd68"
yellow  = "#f0c674"
blue    = "#81a2be"
magenta = "#b294bb"
cyan    = "#8abeb7"
white   = "#c5c8c6"

[colors.bright]
black   = "#666666"
red     = "#d54e53"
green   = "#b9ca4a"
yellow  = "#e7c547"
blue    = "#7aa6da"
magenta = "#c397d8"
cyan    = "#70c0b1"
white   = "#eaeaea"
